[build-system]
requires = ["meson-python>=0.15"]
build-backend = "mesonpy"

[project]
name = "hikoboshi"
version = "0.1.0"
description = "Native bioinformatics suite for search, alignment, MSA, and more"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "Casey Mogilevsky" }]
keywords = ["protein", "alignment", "structural-bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/megure-labs/hikoboshi"
Repository = "https://github.com/megure-labs/hikoboshi"
Issues = "https://github.com/megure-labs/hikoboshi/issues"

[tool.meson-python.args]
setup = ["-Dhikoboshi_python_api=true"]
